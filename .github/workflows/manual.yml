name: Kernel Build

on:
  push:
    branches:
      - ksu-next-susfs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: false  # Disable broken mkbootimg submodule

    - name: Set up dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential cpio curl \
          flex git kmod libssl-dev libelf-dev libncurses-dev \
          lz4 python3 python3-pip unzip zip ccache

        pip install setuptools

    - name: Download and extract prebuilt Clang toolchain
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        wget https://github.com/arter97/llvm-toolchain/releases/download/20240609/clang-r450784b.tar.xz
        tar -xf clang-r450784b.tar.xz
        echo "TOOLCHAIN_DIR=$HOME/toolchains/clang-r450784b" >> $GITHUB_ENV

    - name: Clone mkbootimg from osm0sis
      run: |
        git clone https://github.com/osm0sis/mkbootimg.git mkbootimg

    - name: Set up environment variables
      run: |
        echo "PATH=$TOOLCHAIN_DIR/bin:$PATH" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Build kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CROSS_COMPILE: aarch64-linux-gnu-
        PATH: ${{ env.TOOLCHAIN_DIR }}/bin:${{ env.PATH }}
        CCACHE: 1
      run: |
        chmod +x build_kernel.sh
        ./build_kernel.sh

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        name: "Kernel Build - ${{ github.sha }}"
        tag_name: "build-${{ github.run_number }}"
        files: |
          boot.img
          arter97-kernel-*-kernelsu-boot.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
