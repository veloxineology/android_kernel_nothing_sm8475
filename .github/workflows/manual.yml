name: Kernel Build and Release

on:
  push:
    branches:
      - ksu-next-susfs
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            lz4 cpio fakeroot bc bison flex libssl-dev \
            build-essential python3 python3-pip ccache
          pip3 install --upgrade pip
          pip3 install setuptools

      - name: Make Build Script Executable
        run: chmod +x ./build_kernel.sh

      - name: Run Kernel Build Script
        run: ./build_kernel.sh

      - name: Prepare Artifact for Release
        run: |
          VERSION=$(cat version)
          cp -f boot.img arter97-kernel-${VERSION}-kernelsu-boot.img

      - name: Create GitHub Release & Upload Boot Image
        uses: softprops/action-gh-release@v2
        with:
          name: Kernel Build ${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          files: arter97-kernel-*-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
