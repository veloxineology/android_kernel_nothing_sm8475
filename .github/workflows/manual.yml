name: Kernel Build and Release

on:
  push:
    branches:
      - ksu-next-susfs
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Dependencies
        run: |
          sudo apt update
          sudo apt install -y lz4 cpio fakeroot bc bison flex libssl-dev python3 python3-pip
          pip3 install --upgrade pip
          pip3 install setuptools

      - name: Make Script Executable
        run: chmod +x ./build_kernel.sh

      - name: Build Kernel
        run: ./build_kernel.sh

      - name: Rename Output File
        run: |
          VERSION=$(cat version)
          cp -f boot.img arter97-kernel-${VERSION}-kernelsu-boot.img

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          name: arter97-kernel-${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          files: arter97-kernel-*-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
