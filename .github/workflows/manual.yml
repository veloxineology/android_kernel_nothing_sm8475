name: Build Kernel

on:
  push:
    branches: [ ksu-next-susfs ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison cpio curl flex git libssl-dev libncurses-dev python3 python3-pip lz4 fakeroot build-essential

    - name: Set up toolchain
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        curl -LO https://github.com/ClangBuiltLinux/llvm-project/releases/download/20.1.4/clang+llvm-20.1.4-x86_64-linux-gnu.tar.xz
        tar -xf clang+llvm-20.1.4-x86_64-linux-gnu.tar.xz
        echo "TOOLCHAIN=$HOME/toolchains/clang+llvm-20.1.4-x86_64-linux-gnu" >> $GITHUB_ENV
        echo "PATH=$HOME/toolchains/clang+llvm-20.1.4-x86_64-linux-gnu/bin:$PATH" >> $GITHUB_ENV

    - name: Download mkbootimg from AOSP
      run: |
        rm -rf mkbootimg
        mkdir mkbootimg
        curl -s "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main?format=TEXT" \
        | base64 -d \
        | tar -x --strip-components=1 -C mkbootimg
        chmod +x mkbootimg/*.py

    - name: Run build script
      env:
        PATH: ${{ env.TOOLCHAIN }}/bin:${{ env.PATH }}
      run: |
        chmod +x build_kernel.sh
        ./build_kernel.sh

    - name: Upload boot.img to GitHub Releases
      uses: ncipollo/release-action@v1
      with:
        artifacts: "boot.img"
        tag: "autobuild-${{ github.run_number }}"
        name: "Auto Build ${{ github.run_number }}"
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
