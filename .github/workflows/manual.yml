name: Kernel Build and Release

on:
  push:
    branches:
      - ksu-next-susfs
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            lz4 cpio fakeroot bc bison flex libssl-dev \
            build-essential python3 python3-pip ccache wget tar
          pip3 install --upgrade setuptools

      - name: Download Neutron Clang Toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          wget -q https://github.com/Neutron-Toolchains/clang-builds/releases/download/20240606/neutron-clang-20240606.tar.xz
          tar -xf neutron-clang-20240606.tar.xz
          echo "CLANG_PATH=$HOME/toolchains/neutron-clang" >> $GITHUB_ENV

      - name: Set Environment Variables
        run: |
          echo "PATH=$CLANG_PATH/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      - name: Make Build Script Executable
        run: chmod +x ./build_kernel.sh

      - name: Run Kernel Build Script
        run: ./build_kernel.sh

      - name: Rename & Prepare Boot Image
        run: |
          VERSION=$(cat version)
          cp -f boot.img arter97-kernel-${VERSION}-kernelsu-boot.img

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Kernel Build ${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          files: arter97-kernel-*-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
