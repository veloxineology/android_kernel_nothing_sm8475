name: Kernel Build

on:
  push:
    branches: [ksu-next-susfs]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ca-certificates cpio curl file flex gcc git \
                              libncurses-dev libssl-dev lz4 lzop python3 unzip wget xz-utils \
                              zip fakeroot libelf-dev ccache

      - name: Clone Prebuilt Clang Toolchain
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 ~/toolchains/clang
          echo "CLANG_PATH=$(find ~/toolchains/clang -type d -name 'clang-*' | head -n 1)/bin" >> $GITHUB_ENV

      - name: Export Clang Path
        run: echo "$CLANG_PATH" >> $GITHUB_PATH

      - name: Make build script executable
        run: chmod +x build_kernel.sh

      - name: Run Kernel Build
        run: ./build_kernel.sh

      - name: Upload boot image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: boot.img

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boot.img
            arter97-kernel-*-kernelsu-boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
