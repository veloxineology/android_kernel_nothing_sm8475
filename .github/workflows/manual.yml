name: Kernel Build

on:
  push:
    branches:
      - ksu-next-susfs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc cpio curl gcc git lz4 make python3 python3-pip fakeroot liblz4-tool
        pip install setuptools

    - name: Set up toolchain (Clang r487747c)
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
        tar -xf clang-r487747c.tar.gz
        echo "CLANG_PATH=$HOME/toolchains" >> $GITHUB_ENV
        echo "$HOME/toolchains/bin" >> $GITHUB_PATH

    - name: Clone mkbootimg (if not submodule)
      run: |
        if [ ! -f mkbootimg/mkbootimg.py ]; then
          rm -rf mkbootimg
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
        fi

    - name: Build Kernel
      run: |
        chmod +x ./build_kernel.sh
        ./build_kernel.sh

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          boot.img
          arter97-kernel-*-kernelsu-boot.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
